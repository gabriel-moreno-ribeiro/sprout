name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:extension
      - name: the committed extension build is up to date
        run: git diff --exit-code -- extension/lib
      - uses: actions/upload-artifact@v4
        with:
          name: focus-extension
          path: extension
